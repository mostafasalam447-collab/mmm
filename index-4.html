<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#0f172a;line-height:1.6;padding-bottom:60px}
#err{display:none;background:#fee2e2;color:#991b1b;padding:12px 16px;font-size:14px;direction:ltr}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}
.hero{background:linear-gradient(135deg,#0f766e,#0891b2);color:#fff;border-radius:0 0 22px 22px;padding:28px 18px 22px;text-align:center}
.hero h1{font-size:26px;margin-bottom:4px}

.hero .by{margin-top:6px;font-weight:700;letter-spacing:.04em}
.top{position:sticky;top:0;z-index:60;background:#0f172a;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.tabs{display:flex;max-width:820px;margin:0 auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:112px;max-width:150px;padding:10px 8px 8px;border:0;background:transparent;color:#94a3b8;font-weight:700;font-size:12.5px;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;line-height:1.35}
.tab small{display:block;font-weight:400;font-size:10.5px;opacity:.8;direction:ltr}
.tab.on{color:#fff;border-bottom-color:#22d3ee;background:rgba(255,255,255,.06)}
.bar{padding:6px 12px 8px;color:#fff}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
.bar .pill{background:rgba(255,255,255,.12);padding:3px 10px;border-radius:14px}
.pg{flex:1;min-width:60px;height:6px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:#22d3ee;transition:width .3s}
.swipehint{text-align:center;color:#64748b;font-size:12px;margin:8px 0 2px}
.panel{display:none}
.panel.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:.2;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel.on{animation:none}.pg i{transition:none}}
.ptitle{text-align:center;margin:14px 0 0;font-size:18px;color:#0f172a}
.ptitle small{display:block;color:#64748b;font-size:13px;direction:ltr;font-weight:400}
.sec{margin:26px 0 6px;text-align:center;font-weight:700;color:#0f766e;font-size:14px;background:#ccfbf1;border:1px solid #99f6e4;border-radius:12px;padding:8px 12px}
.card{background:#fff;border-radius:16px;padding:18px 16px;margin:12px 0;box-shadow:0 2px 12px rgba(15,23,42,.08);border-right:6px solid #cbd5e1}
.card.ok{border-right-color:#10b981}.card.no{border-right-color:#ef4444}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:10px;direction:ltr}
.qn{background:#0f766e;color:#fff;min-width:32px;height:32px;border-radius:16px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.tag{background:#ccfbf1;color:#0f766e;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
.qt{font-size:16px;font-weight:700;direction:ltr;text-align:left;margin-bottom:12px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px;direction:ltr}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:11px 12px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font-size:15px;cursor:pointer;color:#1e293b;font-family:inherit}
.opt b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:13px;background:#f1f5f9;border:2px solid #cbd5e1;font-size:12px;flex-shrink:0}
.opt:focus-visible,.btn:focus-visible,.tab:focus-visible,.inp:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
.opt.right{border-color:#10b981;background:#ecfdf5;color:#065f46;font-weight:700}
.opt.right b{background:#10b981;border-color:#10b981;color:#fff}
.opt.bad{border-color:#ef4444;background:#fef2f2;color:#7f1d1d}
.opt.bad b{background:#ef4444;border-color:#ef4444;color:#fff}
.opt:disabled{cursor:default}
.inp{width:100%;padding:11px 12px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;margin-bottom:8px;direction:ltr;font-family:inherit}
.inp.ok{border-color:#10b981;background:#ecfdf5}.inp.no{border-color:#ef4444;background:#fef2f2}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{padding:10px 18px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn.gh{background:#e2e8f0;color:#334155}
.btn:disabled{opacity:.5;cursor:default}
.solbox{display:none;margin-top:12px;background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:10px;direction:ltr;font-size:14px;text-align:left;white-space:pre-line}
.solbox .ans{font-weight:700;color:#0f766e}
.solbox .ex{margin-top:6px;color:#334155}
.result{display:none;background:#fff;border-radius:18px;padding:22px 16px;margin:20px 0;text-align:center;box-shadow:0 4px 20px rgba(15,23,42,.12)}
.big{font-size:44px;font-weight:900;color:#0f766e}
.stats{display:flex;gap:10px;justify-content:center;margin:14px 0}
.stat{flex:1;border-radius:12px;padding:10px;font-weight:700}
.stat.c{background:#ecfdf5;color:#059669}.stat.w{background:#fef2f2;color:#dc2626}.stat.p{background:#fffbeb;color:#b45309}
.rev{text-align:right;margin-top:14px}
.ri{background:#fef2f2;border-right:4px solid #ef4444;border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}
.ri .q{font-weight:700;direction:ltr;text-align:left}
.ri .a{direction:ltr;text-align:left;color:#065f46;margin-top:4px}
.sbtn{display:block;margin:20px auto 0;padding:14px 50px;font-size:16px}
</style>
</head>

<script>
window.onerror=function(m,s,l){var e=document.getElementById('err');if(e){e.style.display='block';e.textContent='JS error: '+m+' (line '+l+')';}};
var L='ABCDEFGHIJ'.split('');

var TABS=[
 {k:'lab1',label:'🧪 المبادئ العامة للمختبر (1)',sub:'Lab Principles I'},
 {k:'lab2',label:'🩸 المبادئ العامة للمختبر (2)',sub:'Lab Principles II'},
 {k:'ab1',label:'⚗️ مفاهيم الأحماض والقواعد',sub:'Acids & Bases'},
 {k:'ab2',label:'📐 قوة واتزان الأحماض والقواعد',sub:'Strengths & Equilibria'},
 {k:'par',label:'🪱 مفاهيم عامة في الطفيليات',sub:'General Parasitology'},
 {k:'pro',label:'🦠 مقدمة في الأوليات',sub:'Intro to Protozoa'},
 {k:'eh',label:'🧫 الأميبا الحالة للنسيج',sub:'E. histolytica'},
 {k:'fla',label:'💧 الأميبا حرة المعيشة',sub:'Free-living Amoeba'},
 {k:'nut',label:'🥗 التغذية',sub:'Nutrition'}
];

var Q=[];
function M(tab,secTitle,tag,list){list.forEach(function(it){Q.push({t:tab,st:secTitle,tag:tag,type:'mcq',q:it[0],o:it[1],c:it[2],e:it[3]||''});});}
function T(tab,secTitle,tag,list){list.forEach(function(it){Q.push({t:tab,st:secTitle,tag:tag,type:'mcq',q:it[0],o:['True','False'],c:it[1]?0:1,e:it[2]||''});});}
function P(tab,secTitle,tag,list){list.forEach(function(it){Q.push({t:tab,st:secTitle,tag:tag,type:'num',q:it[0],v:it[1],unit:it[2],sol:it[3]});});}

/* ---------- Lab Principles I ---------- */
M('lab1','Part 1 — Multiple Choice','MCQ',[
["Which branch of chemistry focuses on separating, identifying, and quantifying chemical components of matter?",["Organic Chemistry","Analytical Chemistry","Physical Chemistry","Biochemistry"],1,"Analytical chemistry is the branch focused on separating, identifying, and quantifying chemical components of matter."],
["Determining the numerical amount or relative proportion of a specific analyte in a sample is known as:",["Qualitative Analysis","Quantitative Analysis","Physical Testing","Biological Screening"],1,"Quantitative analysis determines the numerical amount; qualitative analysis determines identity."],
["Which of the following is classified under Physical Hazards in the laboratory?",["Corrosive chemicals","Electricity and Fire","Culture media","Carcinogens"],1,"Physical hazards include electricity, fire, equipment, and glassware."],
["How should biological hazards such as urine, stool, and blood specimens be safely handled?",["Pipette them by mouth","Collect specimens in clean, dry, sterile containers and wear disposable gloves","Store them in flammable storage cabinets","Mix them directly with acid solutions"],1,"Wear gloves/masks/lab coats, disinfect surfaces, and use sterile containers."],
["In case of an Acid Burn, what is the recommended immediate first-aid step?",["Apply ointment immediately","Neutralize directly with concentrated alkali","Rinse under running water for 10-15 minutes and leave the wound exposed","Cover tightly with a dry cloth without rinsing"],2,"Rinse under running water for 10-15 minutes without applying creams or ointments."],
["When responding to an Alkali Burn, what should you avoid doing unless specifically directed by a medical professional?",["Rinsing with cool water","Seeking medical assistance","Attempting to neutralize the burn with another chemical","Removing contaminated outer gloves"],2,"Rinse alkali burns with cool water and avoid chemical neutralization unless directed by a doctor."],
["If a person suffers an Electric Shock in the laboratory, what is the FIRST action you should take?",["Apply antiseptic lotion","Put off the main switch","Start chest compressions immediately without checking power","Give the person water to drink"],1,"The first step is turning off the main switch to cut off the electrical source."],
["Which glass flask is specifically designed and used for making final exact volumes of reagents?",["Conical flask","Flat bottomed flask","Round bottomed flask","Volumetric flask"],3,"Volumetric flasks are designed for preparing standard solutions and making up precise final volumes."],
["Which type of laboratory bottles is used specifically to store hygroscopic reagents?",["Drop bottles","Screw-capped bottles","Reagent drop flasks","Open glass beakers"],1,"Screw-capped bottles prevent contact with air moisture, so they suit hygroscopic reagents."],
["Which laboratory glassware is primarily used for titration procedures?",["Burette","Measuring cylinder","Test tube","Round bottomed flask"],0,"Burettes (along with conical flasks) are the standard glassware for titration."]
]);
T('lab1','Part 2 — True / False','T/F',[
["Qualitative analysis determines the numerical amount of a substance in a sample.",false,"Qualitative analysis determines identity; quantitative analysis determines the numerical amount."],
["Centrifuges must be properly balanced and closed before operation.",true,"Balancing and closing the centrifuge is a critical safety rule."],
["It is acceptable to pipette liquids by mouth as long as non-toxic liquids are used.",false,"Never pipette by mouth under any circumstances; always use mechanical pipetting devices."],
["Flammable chemicals should be stored in approved flammable storage cabinets in a cool place.",true,"This minimizes chemical hazards."],
["For strong acid exposure, rinsing first with water followed by a dilute 1-2% ammonia or sodium bicarbonate solution is recommended.",true,"After extensive rinsing with water, a mild 1-2% sodium bicarbonate or dilute ammonia solution can be applied."],
["Beakers are typically used for measuring exact liquid volumes in titrations.",false,"Beakers are for holding/mixing reagents, not exact volumes (use volumetric flasks, burettes, or pipettes)."],
["Conical flasks (Erlenmeyer flasks) are commonly used for titrations and boiling liquids.",true,"Their shape allows easy swirling during titration and safe boiling."],
["Drop bottles are used to store large bulk volumes of liquid reagents.",false,"Drop bottles are used for dispensing solutions drop by drop."],
["Biological hazardous waste should be allowed to accumulate in the laboratory until the end of the week before disposal.",false,"Biological waste must be disposed of properly and NOT allowed to accumulate."],
["Round bottomed flasks are suitable for heating liquids under high heat.",true,"They distribute heat uniformly, making them ideal for high-heat applications."]
]);

/* ---------- Lab Principles II ---------- */
M('lab2','Part 1 — Multiple Choice','MCQ',[
["Which vein is the most common and preferred site for performing a standard venipuncture?",["Basilic vein","Cephalic vein","Median cubital vein","Metacarpal vein"],2],
["What is the correct angle of needle penetration into the vein during venipuncture?",["10° – 15°","30° – 40°","60° – 70°","90°"],1],
["Which blood collection tube contains EDTA and is used for Complete Blood Count (CBC)?",["Red top","Lavender top","Light Blue top","Grey top"],1],
["A light blue top tube containing 3.2% Sodium citrate is designated for which laboratory tests?",["Glucose estimation","Coagulation studies (PT, APTT)","Erythrocyte Sedimentation Rate (ESR)","Blood cultures"],1],
["Which additive is present in a Grey-top tube used for accurate glucose estimation?",["Heparin","Sodium citrate 3.8%","Sodium fluoride + Potassium oxalate","Gel separator only"],2],
["How should the venipuncture site be cleaned with spirit cotton prior to needle insertion?",["From the outside moving inward in circles","In a circular motion from the center outward","Up and down vigorously","Side to side repeatedly"],1],
["What concentration of ethanol (spirit) is used for site preparation in phlebotomy?",["50%","70%","95%","100%"],1],
["Which type of solution is defined as containing one gram molecular weight of a substance dissolved in 1 liter of solution?",["Molal solution","Molar solution","Normal solution","Saturated solution"],1],
["How many grams of NaOH are required to prepare 1 Liter of 1 M NaOH solution? (Na=23, O=16, H=1)",["20 grams","40 grams","58.5 grams","80 grams"],1,"MW of NaOH = 23 + 16 + 1 = 40 g/mol, so 1 M = 40 g per liter."],
["What is a solution called when a gram equivalent weight of a substance is dissolved in 1 liter of solution?",["Percent solution","Molal solution","Normal solution (N)","Saturated solution"],2]
]);
T('lab2','Part 2 — True / False','T/F',[
["Phlebotomy is defined as the technique of collecting blood samples from a peripheral vein.",true],
["Ankle or foot veins should be routinely attempted if forearm veins are difficult to find.",false,"Avoid foot/ankle veins."],
["A green-top tube contains Heparin and is used for troponin levels and chromosome studies.",true],
["A black-top tube contains 3.8% Sodium citrate and is used for Erythrocyte Sedimentation Rate (ESR).",true],
["The tourniquet should remain tightly tied around the arm while filling all collection tubes and removing the needle.",false,"Release the tourniquet before removing the needle."],
["After transferring blood into additive-containing tubes, they should be mixed by vigorous shaking.",false,"Mix by gentle inversion 5-6 times."],
["A molal solution is prepared by dissolving 1 gram molecular weight of a substance in 1 kg of solvent.",true],
["For fasting blood sample collection, the patient is permitted to drink tea or coffee right before the draw.",false,"No tea/coffee for a fasting sample."],
["A 0.9% NaCl solution (normal saline) is an example of a weight/volume (w/v) percent solution prepared by dissolving 0.9 g of NaCl in 100 ml of water.",true],
["If a patient feels dizzy during or after blood collection, they should be asked to lie down flat.",true]
]);
P('lab2','Laboratory Solutions Practice Problems — اكتب الناتج كرقم','Problem',[
["Molar — Calculate the mass of KOH required to prepare 2.5 liters of a 0.5 M solution. (K = 39, O = 16, H = 1)",70,"g","MW of KOH = 39 + 16 + 1 = 56 g/mol\nmoles = M × V = 0.5 × 2.5 = 1.25 mol\nmass = 1.25 × 56 = 70 g"],
["Molar — 58.5 g of NaCl is dissolved in water to make 500 mL of solution. What is the Molarity? (Na = 23, Cl = 35.5)",2,"M","MW of NaCl = 58.5 g/mol → moles = 58.5 / 58.5 = 1 mol\nV = 0.5 L\nM = 1 / 0.5 = 2 M"],
["Molar — How many grams of Glucose (C6H12O6) are present in 750 mL of a 2 M glucose solution? (C = 12, H = 1, O = 16)",270,"g","MW of glucose = 180 g/mol\nmoles = 2 × 0.75 = 1.5 mol\nmass = 1.5 × 180 = 270 g"],
["Molal — What is the molality of a solution prepared by dissolving 80 g of NaOH in 2 kg of pure water? (Na = 23, O = 16, H = 1)",1,"molal","MW of NaOH = 40 g/mol → moles = 80 / 40 = 2 mol\nmolality = 2 mol / 2 kg = 1 molal"],
["Molal — Calculate the amount of Urea (MW = 60 g/mol) needed to add to 500 g of water to produce a 0.4 molal solution.",12,"g","moles = molality × kg solvent = 0.4 × 0.5 = 0.2 mol\nmass = 0.2 × 60 = 12 g"],
["Molal — 111 g of CaCl2 (MW = 111 g/mol) is dissolved in 2.5 kg of solvent. Determine the molal concentration.",0.4,"molal","moles = 111 / 111 = 1 mol\nmolality = 1 / 2.5 = 0.4 molal"],
["Normal — Calculate the Normality (N) of a solution containing 49 g of H2SO4 (MW = 98 g/mol, n = 2) dissolved in 500 mL of solution.",2,"N","Equivalent weight = 98 / 2 = 49 g/eq\nequivalents = 49 / 49 = 1 eq\nN = 1 eq / 0.5 L = 2 N"],
["Normal — How many grams of Na2CO3 (MW = 106 g/mol, n = 2) are required to prepare 250 mL of a 0.1 N solution?",1.325,"g","Equivalent weight = 106 / 2 = 53 g/eq\nequivalents = 0.1 × 0.25 = 0.025 eq\nmass = 0.025 × 53 = 1.325 g"],
["Normal — A 1000 mL solution contains 3.65 g of HCl (MW = 36.5 g/mol, n = 1). Find its Normality.",0.1,"N","Equivalent weight = 36.5 g/eq\nequivalents = 3.65 / 36.5 = 0.1 eq\nN = 0.1 / 1 L = 0.1 N"]
]);

/* ---------- Acids & Bases: general concepts ---------- */
M('ab1','Section 1 — Multiple Choice','MCQ',[
["According to the Arrhenius concept, an acid is a substance that increases the concentration of which ion in water?",["Hydroxide ion (OH⁻)","Hydronium ion (H₃O⁺)","Ammonium ion (NH₄⁺)","Carbonate ion (CO₃²⁻)"],1,"Free H⁺ ions react with water to form hydronium ions (H₃O⁺)."],
["Which of the following is classified as a monoprotic acid?",["Sulfuric acid (H₂SO₄)","Phosphoric acid (H₃PO₄)","Nitric acid (HNO₃)","Carbonic acid (H₂CO₃)"],2,"Nitric acid has 1 ionizable hydrogen; H₂SO₄, H₃PO₄ and H₂CO₃ are polyprotic."],
["Why is Methane (CH₄) NOT considered an acid despite containing hydrogen atoms?",["The C–H bonds are ionic.","The C–H bonds are highly polar.","The C–H bonds are weakly polar, so hydrogen ions are not released.","Methane releases OH⁻ ions in water."],2,"Only hydrogens bonded to highly electronegative elements can be released as ions."],
["How many ionizable hydrogen atoms does Ethanoic acid (CH₃COOH) have?",["4","3","1","0"],2,"Only the hydrogen bonded to oxygen ionizes; the 3 hydrogens on carbon do not."],
["Which base exhibits VERY LOW solubility in water according to the lecture slides?",["Sodium hydroxide (NaOH)","Potassium hydroxide (KOH)","Calcium hydroxide (Ca(OH)₂)","Ammonia (NH₃)"],2,"Ca(OH)₂ and Mg(OH)₂ have very low solubility in water."],
["In the Brønsted-Lowry concept, an acid is defined as a:",["Proton acceptor","Proton donor","Electron pair donor","Electron pair acceptor"],1,"Brønsted-Lowry: Acid = proton donor, Base = proton acceptor."],
["In the reaction: NH₃ + H₂O ⇌ NH₄⁺ + OH⁻, what is the conjugate acid of NH₃?",["H₂O","OH⁻","NH₄⁺","H₃O⁺"],2,"A conjugate acid is formed when a base (NH₃) gains a proton."],
["A substance that can act as both an acid and a base (e.g., Amino acids) is termed:",["Monoprotic","Amphoteric","Polyprotic","Caustic"],1,"Amphoteric substances can act as either an acid or a base."],
["According to the Lewis concept, a base is an:",["Electron pair donor","Electron pair acceptor","Proton donor","Proton acceptor"],0,"Lewis: Acid = electron pair acceptor, Base = electron pair donor."],
["In the reaction between Ammonia (NH₃) and Boron Trifluoride (BF₃), BF₃ acts as a Lewis acid because it:",["Donates a proton","Accepts a proton","Donates an electron pair","Accepts an electron pair"],3,"The boron atom in BF₃ accepts the electron pair donated by NH₃."]
]);
T('ab1','Section 2 — True / False','T/F',[
["Free H⁺ ions exist abundantly as free protons in aqueous solution.",false,"Free H⁺ ions do NOT exist in water; they react to form hydronium ions (H₃O⁺)."],
["Phosphoric acid (H₃PO₄) is classified as a polyprotic acid.",true,"It contains three ionizable hydrogens (H₃PO₄ → 3H⁺ + PO₄³⁻)."],
["Hydrogen atoms attached to carbon in CH₃COOH can easily ionize in water.",false,"Hydrogens on carbon are in weakly polar bonds and do NOT ionize."],
["Sodium hydroxide (NaOH) and Potassium hydroxide (KOH) have high solubility in water and are extremely caustic.",true,"NaOH and KOH are highly soluble and highly caustic to skin."],
["Magnesium hydroxide (Mg(OH)₂) has very high solubility in water.",false,"Mg(OH)₂ has VERY LOW solubility in water."],
["A conjugate base is the species formed when a base gains a proton.",false,"A conjugate ACID is formed when a base gains a proton; a conjugate base remains after an acid loses a proton."],
["In the reaction HCl + H₂O ⇌ H₃O⁺ + Cl⁻, the chloride ion (Cl⁻) is the conjugate base of HCl.",true,"Cl⁻ remains after HCl donates its proton."],
["Amino acids are amphoteric because they contain both amine (basic) and carboxylic (acidic) groups.",true,"Amine groups accept protons; carboxylic groups donate protons."],
["The Lewis acid-base concept is restricted only to reactions that involve proton (H⁺) transfer.",false,"The Lewis concept broadened acid-base theory to reactions NOT involving H⁺ transfer."],
["In the Lewis concept, the hydroxide ion (OH⁻) acts as a Lewis base because it has an unshared pair of electrons to donate.",true,"OH⁻ donates an unshared electron pair, so it is a Lewis base."]
]);

/* ---------- Acids & Bases: strengths & equilibria ---------- */
M('ab2','Multiple Choice','MCQ',[
["Which of the following correctly describes a strong acid in aqueous solution?",["It ionizes only partially (<< 100%) in water.","It ionizes completely (100%) to yield H₃O⁺ and an anion.","It holds onto hydrogen ions more strongly than weak acids.","It exists in dynamic equilibrium represented by double arrows (⇌)."],1,"A strong acid is 100% ionized in aqueous solution, giving H₃O⁺ and an anion."],
["According to the Brønsted-Lowry concept, a stronger acid is one that:",["Holds onto hydrogen ions more strongly.","Accepts protons more readily.","Loses its hydrogen ions more easily and donates protons quicker.","Forms a strong conjugate base in solution."],2,"Stronger acids lose hydrogen ions more easily and donate protons quicker."],
["What is the relationship between the strength of an acid and the strength of its conjugate base?",["The stronger the acid, the stronger its conjugate base.","The stronger the acid, the weaker its conjugate base.","Acid strength and conjugate base strength are completely independent.","A strong acid always forms a conjugate base with a very high Kb."],1,"The anion of a strong acid has a negligible tendency to accept a proton."],
["Phosphoric acid (H₃PO₄) is classified as a triprotic acid. How many dissociation constants (Ka) does it have?",["1","2","3","4"],2,"Polyprotic acids lose hydrogen ions one at a time: three ionizable hydrogens = three Ka values."],
["Which mathematical expression correctly defines pKa?",["pKa = 10^(-Ka)","pKa = -log(Ka)","pKa = log(1 / Kb)","pKa = Ka × [H₂O]"],1,"pKa is the negative base-10 logarithm of Ka."],
["An acid with a larger Ka value (or smaller pKa value) indicates:",["A weaker acid.","A stronger acid.","A lower concentration of hydronium ions at equilibrium.","An acid that does not ionize in water."],1,"A larger Ka / smaller pKa means greater ionization, i.e. a stronger acid."],

 var h='<h2>'+msg+'</h2><div class="big">'+pct+'%</div><div class="stats"><div class="stat c">✅ '+c+'<br>صح</div><div class="stat w">❌ '+w+'<br>غلط</div><div class="stat p">⏳ '+p+'<br>متجاوب مش</div></div>';
 if(rev)h+='<div class="rev"><b>الأسئلة اللي غلطت فيها:</b><br><br>'+rev+'</div>';
 h+='<button class="btn gh sbtn" type="button" onclick="resetTab('+ti+')">إعادة المحاولة 🔄</button>';
 var r=document.getElementById('r'+ti);r.innerHTML=h;r.style.display='block';
 r.scrollIntoView({behavior:'smooth',block:'start'});
}
function resetTab(ti){
 TQ[ti].forEach(function(id){delete st[id];});
 document.getElementById('p'+ti).innerHTML=panelHtml(ti);
 window.scrollTo(0,0);upd();
}
function show(ti){
 cur=ti;
 TABS.forEach(function(_,i){
  document.getElementById('t'+i).classList.toggle('on',i===ti);
  document.getElementById('p'+i).classList.toggle('on',i===ti);
 });
 var tb=document.getElementById('t'+ti);
 if(tb.scrollIntoView)tb.scrollIntoView({inline:'center',block:'nearest'});
 window.scrollTo(0,0);upd();
}
(function init(){
 var tabs=document.getElementById('tabs'),panels=document.getElementById('panels'),th='',ph='';
 TABS.forEach(function(t,i){
  th+='<button class="tab" type="button" id="t'+i+'" onclick="show('+i+')">'+esc(t.label)+'<small>'+esc(t.sub)+'</small></button>';
  ph+='<div class="panel" id="p'+i+'">'+panelHtml(i)+'</div>';
 });
 tabs.innerHTML=th;panels.innerHTML=ph;
 var x0=0,y0=0;
 document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
 document.addEventListener('touchend',function(e){
  var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
  if(Math.abs(dx)>90&&Math.abs(dy)<50){
   if(e.target&&e.target.closest&&e.target.closest('.tabs,input'))return;
   if(dx<0&&cur<TABS.length-1)show(cur+1);
   else if(dx>0&&cur>0)show(cur-1);
  }
 },{passive:true});
 show(0);
})();
</script>
